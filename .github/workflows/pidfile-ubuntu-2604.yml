# Temporary #265 evidence: DaemonTest on the ubuntu-26.04 image, where /tmp is tmpfs.
# Delete this workflow once that run is green. It is not part of the product change.
name: Pid file on ubuntu-26.04

on:
  pull_request:

permissions:
  contents: read

jobs:
  daemon-pidfile:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Show directory sizes, then run DaemonTest
        run: |
          echo "runner image facts"
          findmnt -T /tmp || true
          findmnt -T /var/tmp || true
          findmnt -T /dev/shm || true
          t=$(mktemp -d)
          s=$(mktemp -d -p /dev/shm)
          v=$(mktemp -d -p /var/tmp)
          stat -c '/tmp empty-dir %s' "$t"
          stat -c '/dev/shm empty-dir %s' "$s"
          stat -c '/var/tmp empty-dir %s' "$v"
          rmdir "$t" "$s" "$v"
          mvn -B -Dtest=DaemonTest -Dsurefire.failIfNoSpecifiedTests=true test
