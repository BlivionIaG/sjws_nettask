name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) to verify, package Linux/Windows/macOS
# artifacts (portable jar+lib with all Netty QUIC natives, plus a per-OS jlink
# runtime), and publish a GitHub Release.
# workflow_dispatch is dry-run only: the same verify + package matrix, artifacts
# uploaded, never a GitHub Release and never a v* tag.
# See docs/operations/releasing.md and #410.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven version for the dry-run package (no GitHub Release is created)'
        type: string
        default: '0.0.0-SNAPSHOT'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Derive version from tag or dry-run input
        id: v
        env:
          # inputs.* must not be interpolated into run: scripts (script-injection).
          VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$VERSION"
            if [ -z "$version" ]; then
              echo "::error::workflow_dispatch requires inputs.version"
              exit 1
            fi
            if [[ "$version" == v* ]]; then
              echo "::error::pass the Maven version without a leading v (got $version)"
              exit 1
            fi
            tag="v${version}"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          dry_run=$( [ "$EVENT_NAME" = workflow_dispatch ] && echo true || echo false )
          echo "Release mode: event=$EVENT_NAME tag=$tag version=$version dry_run=$dry_run"

  verify:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Prometheus
        run: |
          ver=3.15.0
          curl -fsSL -o /tmp/prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz"
          tar -C /tmp -xzf /tmp/prometheus.tar.gz
          echo "PROMTOOL=/tmp/prometheus-${ver}.linux-amd64/promtool" >> "$GITHUB_ENV"
          echo "PROMETHEUS=/tmp/prometheus-${ver}.linux-amd64/prometheus" >> "$GITHUB_ENV"
      - name: Set project version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build and verify (tests, jar tests, coverage gate)
        run: mvn -B verify

  package:
    needs: [meta, verify]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set project version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Package (tests already ran on ubuntu-latest)
        run: mvn -B -DskipTests package
      - name: Build per-OS distribution and jlink runtime
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: tools/package-release.sh "$VERSION" dist
      - name: Upload dry-run and release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ needs.meta.outputs.version }}
          path: |
            dist/*
            !dist/**/
          if-no-files-found: error

  publish:
    needs: [meta, verify, package]
    if: needs.meta.outputs.dry_run != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*-${{ needs.meta.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Combine SHA256SUMS
        run: |
          set -euo pipefail
          if ! compgen -G 'dist/SHA256SUMS-*' > /dev/null; then
            echo "::error::no per-platform SHA256SUMS-* in dist/"
            ls -la dist || true
            exit 1
          fi
          cat dist/SHA256SUMS-* | awk 'NF && !seen[$0]++' > dist/SHA256SUMS
          ls -lh dist
          cat dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/*.jar dist/SHA256SUMS)
          if [[ ${#assets[@]} -lt 2 ]]; then
            echo "::error::no release assets in dist/"
            exit 1
          fi
          flags=(--title "sjws_nettask $TAG" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "${assets[@]}"
