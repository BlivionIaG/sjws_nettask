name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) to build, verify and publish a GitHub Release.
# workflow_dispatch is dry-run only: build + package on ubuntu-latest, never create a release.
# See docs/operations/releasing.md and #413.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven version for the dry-run package (no GitHub Release is created)'
        type: string
        default: '0.0.0-SNAPSHOT'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload assets (tag pushes only)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for generated notes
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Prometheus
        run: |
          ver=3.15.0
          curl -fsSL -o /tmp/prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz"
          tar -C /tmp -xzf /tmp/prometheus.tar.gz
          echo "PROMTOOL=/tmp/prometheus-${ver}.linux-amd64/promtool" >> "$GITHUB_ENV"
          echo "PROMETHEUS=/tmp/prometheus-${ver}.linux-amd64/prometheus" >> "$GITHUB_ENV"

      - name: Derive version from tag or dry-run input
        id: v
        env:
          # inputs.* must not be interpolated into run: scripts (script-injection).
          VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$VERSION"
            if [ -z "$version" ]; then
              echo "::error::workflow_dispatch requires inputs.version"
              exit 1
            fi
            if [[ "$version" == v* ]]; then
              echo "::error::pass the Maven version without a leading v (got $version)"
              exit 1
            fi
            tag="v${version}"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          dry_run=$( [ "$EVENT_NAME" = workflow_dispatch ] && echo true || echo false )
          echo "Release mode: event=$EVENT_NAME tag=$tag version=$version dry_run=$dry_run"

      # The pom keeps a -SNAPSHOT version on master; the tag (or dry-run input) decides the version.
      - name: Set project version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and verify (tests, jar tests, coverage gate)
        run: mvn -B verify

      - name: Package distribution
        id: dist
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DRY_RUN: ${{ steps.v.outputs.dry_run }}
        run: |
          name="sjws_nettask-$VERSION"
          mkdir -p "dist/$name"
          cp "target/$name.jar" "dist/$name/"
          cp -r target/lib "dist/$name/lib"
          cp LICENSE README.md "dist/$name/"
          # systemd units, the role sample configs and the same-host drop-in
          mkdir -p "dist/$name/contrib"
          cp contrib/*.service contrib/*.yaml contrib/*.conf contrib/sjws "dist/$name/contrib/"
          (cd dist && tar czf "$name.tar.gz" "$name" && zip -qr "$name.zip" "$name")
          cp "target/$name.jar" dist/
          (cd dist && sha256sum "$name.tar.gz" "$name.zip" "$name.jar" > SHA256SUMS)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Distribution"
            echo
            if [ "$DRY_RUN" = true ]; then
              echo "- mode: dry-run (no GitHub Release)"
            else
              echo "- mode: publish"
            fi
            echo "- version: \`$VERSION\`"
            echo "- artifacts: \`$name.tar.gz\`, \`$name.zip\`, \`$name.jar\`, \`SHA256SUMS\`"
            ls -lh "dist/$name.tar.gz" "dist/$name.zip" "dist/$name.jar" dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run artifacts
        if: steps.v.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dryrun-${{ steps.v.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.jar
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.v.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_NAME: ${{ steps.dist.outputs.name }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          name="$DIST_NAME"
          flags=(--title "sjws_nettask $TAG" --generate-notes --verify-tag)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" \
            "dist/$name.tar.gz" "dist/$name.zip" "dist/$name.jar" dist/SHA256SUMS
