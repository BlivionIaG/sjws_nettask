name: Release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`) to build, verify and publish a GitHub Release.
# workflow_dispatch is dry-run only: build + package on ubuntu-latest, never create a release.
# See docs/operations/releasing.md and #413.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven version for the dry-run package (no GitHub Release is created)'
        type: string
        default: '0.0.0-dryrun'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload assets (tag pushes only)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for generated notes
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derive version from tag or dry-run input
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [ -z "$version" ]; then
              echo "::error::workflow_dispatch requires inputs.version"
              exit 1
            fi
            if [[ "$version" == v* ]]; then
              echo "::error::pass the Maven version without a leading v (got $version)"
              exit 1
            fi
            tag="v${version}"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Release mode: event=${{ github.event_name }} tag=$tag version=$version dry_run=$( [ "${{ github.event_name }}" = workflow_dispatch ] && echo true || echo false )"

      # The pom keeps a -SNAPSHOT version on master; the tag (or dry-run input) decides the version.
      - name: Set project version
        run: mvn -B -q versions:set -DnewVersion="${{ steps.v.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and verify (tests, jar tests, coverage gate)
        run: mvn -B verify

      - name: Package distribution
        id: dist
        run: |
          name="sjws_nettask-${{ steps.v.outputs.version }}"
          mkdir -p "dist/$name"
          cp "target/$name.jar" "dist/$name/"
          cp -r target/lib "dist/$name/lib"
          cp LICENSE README.md "dist/$name/"
          # systemd units, the role sample configs and the same-host drop-in
          mkdir -p "dist/$name/contrib"
          cp contrib/*.service contrib/*.yaml contrib/*.conf contrib/sjws "dist/$name/contrib/"
          (cd dist && tar czf "$name.tar.gz" "$name" && zip -qr "$name.zip" "$name")
          cp "target/$name.jar" dist/
          (cd dist && sha256sum "$name.tar.gz" "$name.zip" "$name.jar" > SHA256SUMS)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Distribution"
            echo
            if [ "${{ steps.v.outputs.dry_run }}" = true ]; then
              echo "- mode: dry-run (no GitHub Release)"
            else
              echo "- mode: publish"
            fi
            echo "- version: \`${{ steps.v.outputs.version }}\`"
            echo "- artifacts: \`$name.tar.gz\`, \`$name.zip\`, \`$name.jar\`, \`SHA256SUMS\`"
            ls -lh "dist/$name.tar.gz" "dist/$name.zip" "dist/$name.jar" dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run artifacts
        if: steps.v.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dryrun-${{ steps.v.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.jar
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.v.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${{ steps.dist.outputs.name }}"
          flags=(--title "sjws_nettask ${{ steps.v.outputs.tag }}" --generate-notes --verify-tag)
          if [[ "${{ steps.v.outputs.prerelease }}" == true ]]; then flags+=(--prerelease); fi
          gh release create "${{ steps.v.outputs.tag }}" "${flags[@]}" \
            "dist/$name.tar.gz" "dist/$name.zip" "dist/$name.jar" dist/SHA256SUMS
