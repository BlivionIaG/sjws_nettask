name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly mutation run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # macOS (QUIC natives load there) runs on manual dispatch only: three Linux-specific
    # expectations still fail on it (see docs/development/testing.md, "Known platform gaps").
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Prometheus
        if: runner.os == 'Linux'
        run: |
          ver=3.15.0
          curl -fsSL -o /tmp/prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${ver}/prometheus-${ver}.linux-amd64.tar.gz"
          tar -C /tmp -xzf /tmp/prometheus.tar.gz
          echo "PROMTOOL=/tmp/prometheus-${ver}.linux-amd64/promtool" >> "$GITHUB_ENV"
          echo "PROMETHEUS=/tmp/prometheus-${ver}.linux-amd64/prometheus" >> "$GITHUB_ENV"
      - name: Unit and integration tests, package, coverage gate
        run: mvn -B verify
      - name: HTTP/1 tests with the buffer pool on (debug pool, NoBufferLeaks)
        run: mvn -B -Djacoco.skip=true -DargLine="-Dsjws.buf.pool=on -Dsjws.buf.debug=true" -Dtest='ClientManagerFaultTest,Http1*Test,sjws_nettask.http1.*Test' -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Python SDK conformance and end-to-end (golden frames; Java server + Python unary client)
        run: SJWS_JAR="$(ls target/sjws_nettask-*.jar | head -1)" python3 -B -m unittest discover -s sdk/python/tests -v
      - name: End-to-end file serving (real listener, temp docroot, HTTP client)
        run: mvn -B -Dgroups=e2e -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Multi-node cluster harness (live scenarios)
        run: mvn -B -Dgroups=cluster -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Install wrk
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wrk
      - name: wrk standalone vs gateway-off
        if: runner.os == 'Linux'
        run: GATEWAY_BENCH_WARMUP=1s GATEWAY_BENCH_DURATION=3s tools/gateway-bench.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-${{ matrix.os }}
          path: target/site/jacoco/
          if-no-files-found: ignore

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -P pitest test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-reports
          path: target/pit-reports/
