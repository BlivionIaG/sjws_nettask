name: Cluster tests

# Multi-node cluster harness (tests/sjws_nettask/clusterharness, tag `cluster`, including the
# multi-process HA messaging scenario MsgReplClusterTest, gate G3) plus the
# standalone vs gateway-off wrk (and wrk2) comparison, at full length. Nightly, on demand,
# and on PRs carrying the `cluster-tests` label. The short versions already run in CI on
# every PR. wrk2 p99 and RSS are recorded; they do not fail on an absolute floor.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cluster-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cluster:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'cluster-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -q -DskipTests package
      - name: Cluster harness scenarios
        run: mvn -B -Dgroups=cluster -Dsurefire.failIfNoSpecifiedTests=true test
      - name: wrk cache key
        id: wrk-cache
        run: |
          . /etc/os-release
          echo "key=wrk-${ID}-${VERSION_ID}-${RUNNER_ARCH}-v2" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wrk-cache
          key: ${{ steps.wrk-cache.outputs.key }}
      - name: Install wrk
        env:
          WRK_CACHE: ${{ runner.temp }}/wrk-cache
        run: tools/ci/install-wrk.sh
      - name: Install wrk2
        run: |
          tools/perf-gate/install-wrk2.sh "$HOME/.local/bin/wrk2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: wrk / wrk2 standalone vs gateway-off (full length)
        run: GATEWAY_BENCH_WRK2=1 tools/gateway-bench.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cluster-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
