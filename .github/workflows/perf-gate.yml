name: Perf gate

# A/B wrk benchmark of the PR head against its base branch on the same runner.
# Opt out per PR with the `skip-perf` label. Tune with repository variables
# PERF_THRESHOLD (throughput %, default 10) and PERF_P99_THRESHOLD (default 2x).
# See docs/development/perf-gate.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'tools/perf-gate/**'
      - 'contrib/sjws_nettask-standalone.yaml'
      - '.github/workflows/perf-gate.yml'

permissions:
  contents: read

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-perf') }}
    runs-on: ubuntu-24.04 # Pinned for #265: unpin once all three failing tests pass on 26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: head
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            head/pom.xml
            base/pom.xml
      - name: Install wrk
        run: sudo apt-get update -q && sudo apt-get install -y -q wrk
      - name: Build base and head jars
        run: |
          for side in base head; do
            (cd "$side" && mvn -B -q -DskipTests package)
            jar="$(ls "$side"/target/sjws_nettask-*.jar | grep -v -e sources -e tests | head -n1)"
            echo "${side^^}_JAR=$GITHUB_WORKSPACE/$jar" >> "$GITHUB_ENV"
          done
      - name: Benchmark and compare
        env:
          RUNS: '5'
          DURATION: 10s
          WARMUP: 5s
          THRESHOLD: ${{ vars.PERF_THRESHOLD || '10' }}
          P99_THRESHOLD: ${{ vars.PERF_P99_THRESHOLD || '' }}
        # Scripts and the sample config come from the PR head; the base build only runs as a server.
        # Pass 1: default CLI (standalone). Pass 2: explicit --role=standalone with the packaged
        # standalone config and the swarm forced off (control plane detached on both sides).
        run: |
          args=(--threshold "$THRESHOLD")
          [[ -n "$P99_THRESHOLD" ]] && args+=(--p99-threshold "$P99_THRESHOLD")
          rc=0
          run_pass() { # dir title
            head/tools/perf-gate/bench.sh "$BASE_JAR" "$HEAD_JAR" "perf-out/$1"
            set +e
            python3 head/tools/perf-gate/compare.py "perf-out/$1/base.jsonl" "perf-out/$1/head.jsonl" \
              --title "$2" "${args[@]}" > "perf-out/$1/summary.md"
            local r=$?
            set -e
            cat "perf-out/$1/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            [[ $r -eq 0 ]] || rc=1
          }
          run_pass default "Perf gate: default CLI"
          SERVER_ARGS="--role=standalone --config=$GITHUB_WORKSPACE/head/contrib/sjws_nettask-standalone.yaml" \
          JAVA_OPTS="-Dsjws.swarm.enabled=false" \
            run_pass role-standalone "Perf gate: --role=standalone, sample config, swarm off"
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-gate
          path: perf-out/
          if-no-files-found: ignore
