name: Docker

# Builds the image (never pushed), runs it, and smoke-tests it. See docs/deployment/docker.md.
on:
  push:
    branches: [master]
    paths: &paths
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/**'
      - 'pom.xml'
      - 'HTML/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: sjws_nettask:ci
      NAME: sjws-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=sjws-image
          cache-to: type=gha,mode=max,scope=sjws-image
      - name: Image size
        run: |
          docker image ls "$IMAGE"
          {
            echo "### Image size: $(docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec)"
            echo
            echo '| Layer size | Created by |'
            echo '|---|---|'
            docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' "$IMAGE" \
              | awk -F'\t' '$1 != "0B" { c = substr($2, 1, 90); gsub(/\|/, "\\|", c); printf "| %s | `%s` |\n", $1, c }'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run and wait for healthy
        run: |
          docker run -d --name "$NAME" -p 8080:8080 "$IMAGE"
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$NAME")"
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" = true ] || break
            sleep 2
          done
          docker inspect -f '{{json .State.Health}}' "$NAME"; docker logs "$NAME"; exit 1
      - name: Smoke test
        run: |
          set -x
          [ "$(curl -fsS http://127.0.0.1:8080/healthz)" = ok ]
          curl -fsS -o /dev/null -w '%{http_code} %{content_type}\n' http://127.0.0.1:8080/index.html
          # distroless has no `id`: check the configured user and the live process instead.
          user="$(docker inspect -f '{{.Config.User}}' "$IMAGE")"
          echo "image user: $user"
          [ -n "$user" ] && [ "${user%%:*}" != 0 ] && [ "${user%%:*}" != root ]
          pid_uid="$(docker top "$NAME" -eo pid,uid,comm | awk '$3=="java"{print $2; exit}')"
          echo "java runs as uid $pid_uid"
          [ -n "$pid_uid" ] && [ "$pid_uid" != 0 ] && [ "$pid_uid" != root ]
          # QUIC (HTTP/3) natives must load on the image's glibc.
          docker exec "$NAME" java --enable-native-access=ALL-UNNAMED \
            -cp '/opt/sjws/healthcheck:/opt/sjws/lib/*' HealthCheck --quic
      - name: Logs
        if: always()
        run: docker logs "$NAME" 2>&1 | tail -n 100 || true
      - name: Tear down
        if: always()
        run: docker rm -f "$NAME" || true
