# Optional drop-in for a data node that should start after a local control node.
# Install as /etc/systemd/system/sjws_nettask-data@.service.d/same-host.conf
# After= only orders the start. It does not pull the control node in and it does
# not stop this data node when the control node is down or failing.
[Unit]
After=sjws_nettask-control@1.service
